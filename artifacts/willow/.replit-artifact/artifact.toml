kind = "web"
previewPath = "/"
title = "WILLOW Gaming Club"
version = "1.0.0"
id = "artifacts/willow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21614

[services.development]
run = "pnpm --filter @workspace/willow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/willow", "run", "build" ]
publicDir = "artifacts/willow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21614"
BASE_PATH = "/"
